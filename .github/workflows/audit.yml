name: Audit

on:
  push:
    paths:
      - '**/package.json'
      - 'catalogs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - '**/package.json'
      - 'catalogs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Commit
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        standalone: true
    - name: Audit
      run: pnpm audit
