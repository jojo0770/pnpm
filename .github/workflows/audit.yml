name: Audit

on: [push, pull_request]

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Commit
      uses: actions/checkout@v4
    - name: Install pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        standalone: true
    - name: Audit
      run: |
        audit_dir="$(mktemp -d)"
        AUDIT_DIR="$audit_dir" node -e 'const fs = require("fs"); const path = require("path"); const pkg = require("./pnpm/package.json"); fs.writeFileSync(path.join(process.env.AUDIT_DIR, "package.json"), JSON.stringify({ name: "pnpm-audit", private: true, dependencies: pkg.dependencies ?? {}, optionalDependencies: pkg.optionalDependencies ?? {} }, null, 2) + "\n")'
        cd "$audit_dir"
        pnpm --ignore-workspace install --prod --lockfile-only --ignore-scripts
        pnpm --ignore-workspace audit --prod
